name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        shell: bash
        run: |
          # Preserve the legacy Master Duel sources until they can be formatted
          # in a dedicated change; this PR must not carry Windows-only churn.
          git ls-files 'src-tauri/src/*.rs' 'src-tauri/src/**/*.rs' \
            | sort -u \
            | grep -v '^src-tauri/src/games/master_duel/' \
            | xargs rustfmt --edition 2021 --check --config skip_children=true

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile Tauri application
        run: pnpm tauri build --no-bundle
